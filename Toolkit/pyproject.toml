[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aerospatial-tools"
version = "0.4.0"
description = "Offline AeroSpatial session integrity, simulation, and analysis"
requires-python = ">=3.10"
authors = [{name = "AeroSpatial Contributors"}]
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.6", "numpy>=1.24"]
privacy = ["cryptography>=41"]

[project.scripts]
aerospatial = "aerospatial_tools.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aerospatial_tools*"]
