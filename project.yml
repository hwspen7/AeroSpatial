name: AeroSpatial
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    # CocoaPods embeds the DJI V4 binary framework with an rsync script.
    # Xcode 16.4 script sandboxing prevents copying its nested resource bundles.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
packages:
  AeroSpatialCore:
    path: .
targets:
  AeroSpatial:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aerospatial
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: AeroSpatialCore
