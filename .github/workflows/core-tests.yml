name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-core:
    name: Swift + C++ bridge
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Test portable Swift package and native bridge
        run: swift test
      - name: Replay legacy fixture
        run: swift run aerospatial-replay Docs/sample-session.jsonl
      - name: Replay schema v1 fixture
        run: swift run aerospatial-replay Fixtures/session.jsonl
      - name: Swift ring benchmark smoke test
        run: swift run -c release aerospatial-bench 10000
      - name: Swift virtual-time control scenario
        run: swift run aerospatial-scenario /tmp/aerospatial-swift.jsonl 5 42 2

  native-python:
    name: C++ / Python / parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate repository layout and build references
        run: python Scripts/check-layout.py
      - name: Compile native algorithms
        run: |
          cmake -S Kernel -B build-native -DCMAKE_BUILD_TYPE=Release -DAEROSPATIAL_BUILD_WORK_BENCHMARK=ON
          cmake --build build-native --parallel 4
          ctest --test-dir build-native --output-on-failure
          ./build-native/aerospatial-work-bench 10000 1024
      - name: Fuzz smoke and bounded native resource soak
        run: |
          cmake -S Kernel -B build-native -DAEROSPATIAL_BUILD_FUZZ_SMOKE=ON -DAEROSPATIAL_BUILD_SOAK=ON
          cmake --build build-native --parallel 4
          ./build-native/aerospatial-fuzz-smoke
          ./build-native/aerospatial-soak 25000
      - name: Native multimodal bus throughput smoke test
        run: |
          cmake -S Kernel -B build-bus -DCMAKE_BUILD_TYPE=Release -DAEROSPATIAL_BUILD_BUS_BENCHMARK=ON
          cmake --build build-bus --parallel 4
          ./build-bus/aerospatial-bus-bench 100000 8 0 fast
          ./build-bus/aerospatial-bus-bench 100000 8 0 indexed
          ./build-bus/aerospatial-bus-bench 20000 1024 4 fast
          PYTHONPATH=. python -m aerospatial_tools.soak ./build-bus/aerospatial-bus-bench --count 20000 --payload 1024 --readers 4 --repeats 3
      - name: Verify Python wheel and stable import paths
        run: |
          python -m pip wheel . --no-deps -w "$RUNNER_TEMP/wheels"
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install "$RUNNER_TEMP"/wheels/aerospatial_tools-*.whl
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/wheel-venv/bin/python" -c "import aerospatial_tools.cli, aerospatial_tools.frames, aerospatial_tools.evidence_pipeline; print('packaged imports OK')")
      - name: Unit and cross-language tests
        env:
          PYTHONPATH: .
          AEROSPATIAL_NATIVE_PROBE: ${{ github.workspace }}/build-native/aerospatial-native-probe
          AEROSPATIAL_WIRE_PROBE: ${{ github.workspace }}/build-native/aerospatial-wire-probe
          AEROSPATIAL_QOS_PROBE: ${{ github.workspace }}/build-native/aerospatial-qos-probe
        run: python -m unittest discover -s ToolkitTests -v
      - name: Python stream benchmark smoke test
        env:
          PYTHONPATH: .
        run: python -m aerospatial_tools benchmark --count 10000 --iterations 2
      - name: Validate recorded data contracts
        env:
          PYTHONPATH: .
        run: |
          python -m aerospatial_tools validate Docs/sample-session.jsonl
          python -m aerospatial_tools report Fixtures/session.jsonl
          python -m aerospatial_tools simulate "$RUNNER_TEMP/aerospatial.jsonl" --seconds 5 --seed 42
          python -m aerospatial_tools validate "$RUNNER_TEMP/aerospatial.jsonl"
          python -m aerospatial_tools audit "$RUNNER_TEMP/aerospatial.jsonl"
          python -m aerospatial_tools gate "$RUNNER_TEMP/aerospatial.jsonl" --profile Quality/simulator.json
          python -m aerospatial_tools sanitize "$RUNNER_TEMP/aerospatial.jsonl" "$RUNNER_TEMP/public.jsonl"
          python -m aerospatial_tools validate "$RUNNER_TEMP/public.jsonl"
          python -m aerospatial_tools bus-audit Fixtures/multimodal.jsonl
          python -m aerospatial_tools algorithms Fixtures/algorithms.json
          python -m aerospatial_tools trace-audit Fixtures/traces.jsonl
          python -m aerospatial_tools workload --samples 1000 --seed 42
          python -m aerospatial_tools digest create "$RUNNER_TEMP/public.jsonl" "$RUNNER_TEMP/digest.json"
          python -m aerospatial_tools digest verify "$RUNNER_TEMP/public.jsonl" "$RUNNER_TEMP/digest.json"

  native-windows:
    name: Native C++ Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test native library
        run: |
          cmake -S Kernel -B build-native
          cmake --build build-native --config Release --parallel
          ctest --test-dir build-native -C Release --output-on-failure

  native-sanitizer:
    name: Native memory safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake -S Kernel -B build-sanitize -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-sanitize --parallel 4
      - name: Verify native memory and concurrency regression tests
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-sanitize --output-on-failure

  native-libfuzzer:
    name: H.264 and wire protocol libFuzzer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build C++ with Clang, AddressSanitizer and libFuzzer
        run: |
          cmake -S Kernel -B build-fuzz -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF \
            -DCMAKE_CXX_COMPILER=clang++ -DAEROSPATIAL_BUILD_LIBFUZZER=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-fuzz --target aerospatial-fuzz --parallel 4
      - name: Run seed corpus and deterministic mutation campaign
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          mkdir -p fuzz-corpus
          cp Fixtures/h264-six-frames.264 fuzz-corpus/real-stream.264
          ./build-fuzz/aerospatial-fuzz fuzz-corpus -runs=12000 -max_len=4096 \
            -timeout=5 -rss_limit_mb=1024 -seed=20261113

  native-tsan:
    name: Native C++ ThreadSanitizer races
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build instrumented concurrency tests
        run: |
          cmake -S Kernel -B build-tsan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build-tsan --parallel 4 --target \
            test_bus_concurrency test_bus_budget_race test_work_queue \
            test_resource_governor test_executor test_memory
      - name: Run race checks with fail-on-race semantics
        env:
          TSAN_OPTIONS: halt_on_error=1 history_size=7
        run: ctest --test-dir build-tsan --output-on-failure -R "native_(bus_concurrency|bus_budget_race|work_queue|resource_governor|executor|memory)"

  native-soak:
    name: Native resource lifecycle and long-run memory regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build repeatable long-running resource tests
        run: |
          cmake -S Kernel -B build-soak -DCMAKE_BUILD_TYPE=Release \
            -DAEROSPATIAL_BUILD_SOAK=ON
          cmake --build build-soak --parallel 4 --target \
            aerospatial-soak test_bus_soak test_resource_governor
      - name: Repeat lifecycle workload and concurrent bus load
        env:
          AEROSPATIAL_SOAK_EVENTS: 150000
        run: |
          ./build-soak/aerospatial-soak 200000
          ctest --test-dir build-soak --output-on-failure -R "native_(bus_soak|resource_governor)"

  offline-vision-privacy:
    name: Offline vision and encrypted export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional vision and privacy libraries
        run: python -m pip install -e '.[vision,privacy]'
      - name: Decode real generated video, RANSAC matching, AES-GCM and worker checks
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s ToolkitTests -p 'test_video_vision.py' -v
          python -m unittest discover -s ToolkitTests -p 'test_vault.py' -v
          python -m unittest discover -s ToolkitTests -p 'test_worker.py' -v

  spatial-estimation:
    name: Spatial geometry, optimization and reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional mathematical estimation dependencies
        run: python -m pip install -e '.[mapping]'
      - name: Run all spatial P1 numerical truth and regression tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s ToolkitTests -p '*_p1.py' -v
          python -m aerospatial_tools spatial-demo --seed 42
          python -m aerospatial_tools spatial-demo --seed 77

  p2-developer-contracts:
    name: P2 developer contracts and replay safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test content identity, experimental determinism and retention policies
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s ToolkitTests -p 'test_p2_*.py' -v
          python -m aerospatial_tools --help

  p3-offline-integration:
    name: P3 real inference, video evidence and privacy contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tested offline vision dependencies
        run: python -m pip install -e '.[vision,privacy]'
      - name: Test real ONNX execution, image evidence, ROS observation interface and gates
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s ToolkitTests -p 'test_p3_*.py' -v
          python -m aerospatial_tools video-evidence --help
          python -m aerospatial_tools evidence-gate --help
          python Examples/spatial_evidence.py --help
