name: Unpack AeroSpatial Foundation
on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: foundation-publish
  cancel-in-progress: false
jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate snapshot and extract sources
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, lzma, pathlib, tarfile, sys
          root = pathlib.Path("bootstrap")
          parts = sorted(root.glob("part-*.txt"))
          if len(parts) != 15:
              print(f"Waiting for 15 chunks; found {len(parts)}.")
              sys.exit(0)
          payload = base64.b64decode("".join(p.read_text().strip() for p in parts), validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          assert digest == "0adcf38986b5116dc185fd39610a95140399bb730c431aa7670570b3356ff632", digest
          tar = lzma.decompress(payload)
          with tarfile.open(fileobj=io.BytesIO(tar), mode="r:") as tf:
              for item in tf.getmembers():
                  name = pathlib.PurePosixPath(item.name)
                  if item.issym() or item.islnk() or item.isdev() or name.is_absolute() or ".." in name.parts:
                      raise ValueError("Unsafe archive path")
              tf.extractall(".", filter="data")
          for part in root.iterdir(): part.unlink()
          root.rmdir()
          print("SHA-256 verified, source extracted.")
          PY
      - name: Commit source without modifying workflow definitions
        shell: bash
        run: |
          if [ -d bootstrap ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows/**'
          if ! git diff --cached --quiet; then
            git commit -m 'feat: publish streamlined high-performance AeroSpatial source'
            git push origin HEAD:main
          fi
