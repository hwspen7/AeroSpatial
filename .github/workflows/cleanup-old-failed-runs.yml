name: One-time cleanup of historical failed Actions runs
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    if: github.event.pull_request.number == 2 && github.head_ref == 'refactor/organized-source-layout' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete only the reviewed failed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          for run_id in 43061548670 42899566024 42899172096 42898225344 42897714614 42897714972 42761017821 42760809689 42760523034 42694124655 42673922004 42673399529 42645114250 42640506679 42640483950 42640478824 42640113779; do
            conclusion="$(gh api "repos/${repo}/actions/runs/${run_id}" --jq .conclusion)"
            if [[ "$conclusion" == "failure" ]]; then
              gh api -X DELETE "repos/${repo}/actions/runs/${run_id}"
              echo "Deleted failed run ${run_id}"
            else
              echo "Skipped ${run_id}: current conclusion ${conclusion}"
            fi
          done
          echo "All enumerated failed runs processed."

# Temporary workflow: remove immediately after one verified successful run.