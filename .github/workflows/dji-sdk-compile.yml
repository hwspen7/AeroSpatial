name: DJI SDK iOS integration compilation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dji-sdk-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install project and dependency tooling
        run: brew install xcodegen cocoapods
      - name: Validate iOS app configuration
        run: |
          plutil -lint App/Info.plist
          xcodegen generate
          pod install --repo-update
      - name: Compile the DJI-linked application without signing
        run: |
          xcodebuild -workspace AeroSpatial.xcworkspace \
            -scheme AeroSpatial \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Note hardware boundary
        run: |
          echo 'The SDK-link compile does not demonstrate real Mavic Air 2 hardware compatibility.'
          echo 'Physical device, firmware, data stream, stop/disconnect and timing tests remain required.'
