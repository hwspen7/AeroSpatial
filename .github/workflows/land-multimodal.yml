name: Land multimodal bus source
on:
  push:
    branches: [main]
    paths:
      - '.transfer/multimodal.patch.xz'
      - '.github/workflows/land-multimodal.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and apply reviewed source changes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '89eeecfb43be160f077cee66fb9fb27d215571526ddd60d9f2179f63d0d2f8a4' '.transfer/multimodal.patch.xz' | sha256sum -c -
          xz -dc .transfer/multimodal.patch.xz > /tmp/aerospatial-multimodal.patch
          git apply --check /tmp/aerospatial-multimodal.patch
          git apply /tmp/aerospatial-multimodal.patch
          git restore --source=HEAD -- .github/workflows/core-tests.yml
          rm -rf .transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate bounded C++ multimodal bus with Swift and offline audit'
          git push origin HEAD:main
